<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine?</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      margin: 0;

      background-image: url("./cat.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* dark overlay for contrast */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 0;
    }

    .card {
      width: 600px;
      height: 412px;
      padding: 40px;

      /* GLASS EFFECT */
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);

      position: relative;
      z-index: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin: 0;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    button {
      font-size: 20px;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
      z-index: 2;
    }

    .no {
      background-color: #ddd;
      position: absolute;
      left: 450px;
      top: 255px;
    }

    #response {
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Renee, will YOU be my Valentine? 💖</h1>

    <button class="yes" id="yesBtn">Yes</button>
    <button class="no" id="noBtn">NO you stink!</button>

    <p id="response"></p>
  </div>

  <script>
    const card = document.getElementById("card");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const response = document.getElementById("response");

    card.addEventListener("mousemove", (e) => {
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const dx = e.clientX - (btnRect.left + btnRect.width / 2);
      const dy = e.clientY - (btnRect.top + btnRect.height / 2);
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 90) {
        const maxX = cardRect.width - btnRect.width;
        const maxY = cardRect.height - btnRect.height;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";
      }
    });

    yesBtn.addEventListener("click", () => {
      response.innerHTML =
        "Perfect! It's a date. Me. You. Dinner. 4pm. After that, COCKtails 6:45. After that let's get NASTY.";
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
